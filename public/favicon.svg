<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)"/>
  <!-- 外圈 -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>
  <circle cx="50" cy="50" r="36" fill="none" stroke="#a855f7" stroke-width="0.5" opacity="0.2"/>
  <!-- 内圈 -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
  <!-- 星星 -->
  <polygon points="50,20 53,40 73,40 57,52 63,72 50,60 37,72 43,52 27,40 47,40" fill="url(#starGrad)" opacity="0.9"/>
  <!-- 装饰点 -->
  <circle cx="50" cy="14" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="86" cy="50" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="50" cy="86" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="14" cy="50" r="2" fill="#fbbf24" opacity="0.5"/>
</svg>
